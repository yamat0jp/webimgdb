<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@page.user 様のギャラリー</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #3c4043;
            --text-muted: #70757a;
            --border-color: #e8eaed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Google Sans", Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        body.modal-open {
            overflow: hidden;
        }

        .page-header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .header-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        .back-link:hover {
            background-color: #f1f3f4;
            color: #202124;
        }

        main {
            padding: 2px;
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2px;
        }

        @media (max-width: 600px) {
            .thumbnail-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            .page-header {
                padding: 12px 16px;
            }
        }

        .thumbnail-link {
            display: block;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #f1f3f4;
            position: relative;
            cursor: pointer;
        }

        .thumbnail-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.2s ease;
        }

        .thumbnail-link:hover img {
            filter: brightness(0.85);
        }

        /* --- ライトボックス本体 --- */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .lightbox.active img {
            transform: scale(1);
        }

        /* --- ライトボックスの操作ボタン群 --- */
        .lightbox-btn {
            position: absolute;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            z-index: 1010;
        }

        .lightbox-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* 閉じるボタン */
        .lightbox-close {
            top: 16px;
            left: 16px;
            width: 48px;
            height: 48px;
        }

        /* 前へ・次へボタン */
        .lightbox-nav {
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
        }

        .nav-prev {
            left: 16px;
        }

        .nav-next {
            right: 16px;
        }

        /* 最初/最後の画像でボタンを隠す用 */
        .lightbox-nav.hidden {
            display: none;
        }

        /* スマホ閲覧時などは矢印を少し小さく */
        @media (max-width: 600px) {
            .lightbox-nav {
                width: 40px;
                height: 40px;
            }
            .nav-prev { left: 4px; }
            .nav-next { right: 4px; }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-left">
            <h1>@page.user</h1>
            <span class="header-meta">@Cnt アイテム</span>
        </div>
        <a href="/top" class="back-link">TOPに戻る</a>
    </header>

    <main>
        <div class="thumbnail-grid">
            @ForEach (var Img in Images) {
                <a class="thumbnail-link" href="@Img.Url">
                    <img src="@Img.Url?thmb=yes" alt="@Img.Name の@Img.Index 枚目の画像" loading="lazy">
                </a>
            }
        </div>
    </main>

    <!-- 全画面表示（ライトボックス） -->
    <div id="lightbox" class="lightbox">
        <!-- 閉じるボタン -->
        <button id="lightbox-close" class="lightbox-btn lightbox-close" aria-label="閉じる">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>

        <!-- 前へボタン -->
        <button id="lightbox-prev" class="lightbox-btn lightbox-nav nav-prev" aria-label="前の画像">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
        </button>

        <!-- 次へボタン -->
        <button id="lightbox-next" class="lightbox-btn lightbox-nav nav-next" aria-label="次の画像">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        </button>

        <img id="lightbox-img" src="" alt="拡大画像">
    </div>

    <!-- 動きを制御するJavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 要素の取得
            const links = Array.from(document.querySelectorAll('.thumbnail-link'));
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const closeBtn = document.getElementById('lightbox-close');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');

            let currentIndex = 0; // 現在表示中の画像のインデックス

            // 画像のリスト（URLとalt属性）を配列として保持しておく
            const galleryData = links.map(link => ({
                url: link.getAttribute('href'),
                alt: link.querySelector('img').getAttribute('alt')
            }));

            // 指定したインデックスの画像をライトボックスに表示する関数
            const updateLightboxImage = (index) => {
                currentIndex = index;
                lightboxImg.src = galleryData[currentIndex].url;
                lightboxImg.alt = galleryData[currentIndex].alt;

                // 最初の画像なら「前へ」を隠す
                if (currentIndex === 0) {
                    prevBtn.classList.add('hidden');
                } else {
                    prevBtn.classList.remove('hidden');
                }

                // 最後の画像なら「次へ」を隠す
                if (currentIndex === galleryData.length - 1) {
                    nextBtn.classList.add('hidden');
                } else {
                    nextBtn.classList.remove('hidden');
                }
            };

            // 各サムネイルのクリックイベント
            links.forEach((link, index) => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    updateLightboxImage(index);
                    lightbox.classList.add('active');
                    document.body.classList.add('modal-open');
                });
            });

            // 前へ・次へボタンのクリックイベント
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // 背景クリックと重複しないようにする
                if (currentIndex > 0) updateLightboxImage(currentIndex - 1);
            });

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentIndex < galleryData.length - 1) updateLightboxImage(currentIndex + 1);
            });

            // 閉じる処理
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                document.body.classList.remove('modal-open');
                setTimeout(() => { lightboxImg.src = ""; }, 300);
            };

            closeBtn.addEventListener('click', closeLightbox);

            // 背景クリックで閉じる
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // キーボード操作のサポート（Escで閉じる、左右キーで移動）
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;

                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    updateLightboxImage(currentIndex - 1);
                } else if (e.key === 'ArrowRight' && currentIndex < galleryData.length - 1) {
                    updateLightboxImage(currentIndex + 1);
                }
            });
        });
    </script>
</body>
</html>
