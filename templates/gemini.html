<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@page.user 様のギャラリー</title>
    <style>
        /* モダンなCSSリセットと変数定義 */
        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent-color: #3b82f6;
            --card-bg: #e5e7eb;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ヘッダー周りのレイアウト */
        .page-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        /* ギャラリーのグリッドレイアウト */
        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* サムネイルのコンテナ */
        .thumbnail-link {
            display: block;
            aspect-ratio: 1 / 1;
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* ホバー時のふんわり浮き上がるアニメーション */
        .thumbnail-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* 画像本体 */
        .thumbnail-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        /* ホバー時に画像を少しズームさせる */
        .thumbnail-link:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>@page.user</h1>
        <div class="header-meta">
            <span>公開中 @Cnt 作品</span>
            <a href="/top" class="back-link">&larr; TOPに戻る</a>
        </div>
    </header>

    <main>
        <div class="thumbnail-grid">
            @ForEach (var Img in Images) {
                <a class="thumbnail-link" href="@Img.Url" target="_blank" rel="noopener noreferrer">
                    <img src="@Img.Url?thmb=yes" alt="@Img.Name の@Img.Index 枚目の画像" loading="lazy">
                </a>
            }
        </div>
    </main>
</body>
</html>
