<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
    <style>
    .center {
        text-align: center;
    }
    </style>
</head>
<body>
    <h1 class="center">ギャラリー</h1>
    <select class="center" name="users" onchange="if(this.value) window.location.href=./img/+this.value">
        <option value="">ユーザーギャラリー</option>
        @ForEach (var User in Users) {
        <option value="@User.Name">@User.Name</option>
        }
    </select>
</body>
</html>
